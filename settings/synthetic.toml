# Settings for the hurdle model (option B) on the SYNTHETIC data: corpus v2 (seed 58068921)
# and the synthetic AR ledger. Read by run_hurdle_pipeline.py; checked by hurdle/settings.py,
# which rejects any missing or unknown setting. Relative paths are taken from the repo root.

[data]
corpus_folder = "data/raw/SYNTHETIC_ey_tahsilat_20250602_20260828"  # the daily files
ledger_file   = "data/raw/SYNTHETIC_ey_ar_ledger_asof_20260828.xlsx"
ledger_as_of  = 2026-08-28      # the date the ledger was extracted
holidays_file = "settings/holidays_tr.toml"  # Turkish public holidays
fill_missing_days_from_ledger = true   # days without a daily file: take their payments
                                       # from the ledger (false: the weeks stay missing)
cache_folder  = "data/interim"  # rebuilt automatically when anything changes

[companies]
# EY's company codes; a line with any other code stops the run.
known = ["TR02", "TR04", "TR05", "TR06", "TR91"]
# Placeholder customer IDs under which unidentified cash is booked (e.g. a suspense account).
# Their cash goes to the unidentified-cash table, not to the panel. None in the synthetic data.
unidentified_customers = []

[collections_layout]
# How the daily collection files are laid out.
file_name_date_format = "%d%m%Y"  # "02062025 EY TAHSILAT.XLSX" is 2 June 2025
header_row = 2                    # row 1 is a title ("MERCURY COLLECTIONS")
first_data_row = 3

[collections_layout.headers]
# Header text in the file = our field name. Case and extra spaces do not matter. For other
# spellings (e.g. Turkish headers), add more lines pointing to the same field names.
"Company Code" = "company_code"
"Customer" = "customer"
"Customer Name" = "customer_name"
"Document Date" = "document_date"
"Bank" = "bank"
"SAP Document No" = "sap_document_no"
"Government Inv" = "invoice_no"
"Amount in Original Currency" = "amount_original"
"Document currency" = "currency_original"
"Amount in local currency" = "amount_try"
"Local Currency" = "currency_local"

[ledger_layout]
# How the AR ledger (SAP's FBL5N report) is laid out.
header_row = 1
first_data_row = 2

[ledger_layout.headers]
"Company Code" = "company_code"
"Customer" = "customer"
"Customer Name" = "customer_name"
"Document Number" = "document_no"
"Document Type" = "document_type"
"Reference" = "reference"
"Invoice Reference" = "invoice_reference"
"Document Date" = "document_date"
"Posting Date" = "posting_date"
"Baseline Date" = "baseline_date"
"Terms of Payment" = "payment_terms"
"Net Due Date" = "net_due_date"
"Amount in Doc. Curr." = "amount_document"
"Document Currency" = "document_currency"
"Amount in Local Currency" = "amount_local"
"Clearing Date" = "clearing_date"
"Clearing Document" = "clearing_document"

[ledger_layout.document_types]
# The SAP document-type codes this ledger uses for each role.
invoice = ["RV"]
payment = ["DZ"]      # payments received, and refunds paid out
credit_memo = ["DG"]

[receivables]
# How each customer's receivables are summarised from the AR ledger.
min_cleared_for_delay = 3       # fewer cleared invoices: the usual delay is unknown (NaN)
horizons = 5                    # the "due in week t+1 ... t+5" columns
leak_check_weeks = [0, 16, 32, 48]  # rebuilt from a ledger cut off at the week and compared;
                                    # spread over the history (the last week proves little)
overdue_age_days = [30, 90]     # aging buckets of the overdue amount: 0-30, 31-90 and over 90
                                # days past due (to be confirmed with EY Finance)

[history]
# How each customer's payment history is summarised (the history features).
windows = [4, 13, 52]                 # look-back windows, in weeks
use_ledger_before_first_file = true   # the ledger's payments before the first daily file
                                      # count as history (false: those weeks are unknown)

[stage1]
# Stage 1, the "will it pay?" classifier (HistGradientBoostingClassifier, log loss, no class
# weights, early stopping off). Starting values; the settings grid (U16) tries others.
max_iter = 300                  # number of trees
learning_rate = 0.05
max_leaf_nodes = 31             # leaves per tree
min_samples_leaf = 20           # rows per leaf, at least
random_seed = 1
feature_blocks = ["history", "calendar", "receivables"]   # the horizon h is always in
company_as_feature = true       # the company code (one of the EY entities) as a category
baseline_c = 1.0                # the logistic-regression baseline's C (inverse regularisation)

[stage2]
# Stage 2, the "how much, if it pays?" regressor (HistGradientBoostingRegressor on the paid
# rows, target amount_deflated, early stopping off). The company code goes in exactly when it
# does for stage 1. Starting values copy [stage1]; the stage-2 diagnostic (U11.5) tries others.
loss = "poisson"                # "poisson" (keeps the cash total), "gamma" (relative errors:
                                # big payments weigh little) or "squared_error" (big payments
                                # dominate; can predict below 0)
max_iter = 300                  # number of trees
learning_rate = 0.05
max_leaf_nodes = 31             # leaves per tree
min_samples_leaf = 20           # rows per leaf, at least
random_seed = 1
feature_blocks = ["history", "calendar", "receivables"]   # the horizon h is always in

[diagnostic]
# A train / validation / test of stage 1 tuned on its own, with a grid per model, each chosen
# by `selection_metric` on validation (F1 threshold also chosen on validation) and tested once.
# Diagnostic only: nothing from it reaches the forecast, whose setting is [stage1].
# Splits by target week, H = [receivables] horizons:
# train <= origin < validation <= origin + H < test <= origin + 2H.
run = true                      # long: the time grows with the grid size (72 HGB fits here)
origin = 40
hgb_max_iter = [100, 300, 600, 900]
hgb_learning_rate = [0.01, 0.05, 0.1, 0.15, 0.2, 0.5]
hgb_max_leaf_nodes = [15, 31, 63]
lr_c = [0.01, 0.1, 1.0, 10.0]
class_weights = ["none"]   # tried for both models
selection_metric = "log loss"   # chooses each model's setting on validation: "log loss" or
                                # "brier" (honest probabilities: calibration and separation),
                                # or "avg precision" (ranking of the rare payers)
reference_window = 13           # the "own rate" reference: the customer's paying share over
                                # this many weeks (one of the [history] windows) ...
reference_prior_weeks = 1       # ... plus this many imaginary weeks paid at the base rate
calibration_groups = 10         # groups of the reliability table: rows sorted by p, equal size
importance_repeats = 3          # shuffles per feature for the permutation importance
output_folder = "data/interim/hurdle_diagnostic"   # the result tables, as CSV

[debug]
one_day = 2025-06-02            # the day whose payment lines step 2 prints
sample_week = 30                # the week step 7 shows in detail (week 0 starts 2025-06-02)
demo_origin = 40                # the forecast week step 12 fits and checks stage 1 at; its
                                # target weeks (up to demo_origin + horizons) must have data
