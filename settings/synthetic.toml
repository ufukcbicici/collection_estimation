# Settings for the hurdle model (option B) on the SYNTHETIC data: corpus v2 (seed 58068921)
# and the synthetic AR ledger. Read by run_hurdle_pipeline.py; checked by hurdle/settings.py,
# which rejects any missing or unknown setting. Relative paths are taken from the repo root.

[data]
corpus_folder = "data/raw/SYNTHETIC_ey_tahsilat_20250602_20260828"  # the daily files
ledger_file   = "data/raw/SYNTHETIC_ey_ar_ledger_asof_20260828.xlsx"
ledger_as_of  = 2026-08-28      # the date the ledger was extracted
holidays_file = "settings/holidays_tr.toml"  # Turkish public holidays
fill_missing_days_from_ledger = true   # days without a daily file: take their payments
                                       # from the ledger (false: the weeks stay missing)
cache_folder  = "data/interim"  # rebuilt automatically when anything changes

[companies]
# EY's company codes; a line with any other code stops the run.
known = ["TR02", "TR04", "TR05", "TR06", "TR91"]
# Placeholder customer IDs under which unidentified cash is booked (e.g. a suspense account).
# Their cash goes to the unidentified-cash table, not to the panel. None in the synthetic data.
unidentified_customers = []

[collections_layout]
# How the daily collection files are laid out.
file_name_date_format = "%d%m%Y"  # "02062025 EY TAHSILAT.XLSX" is 2 June 2025
header_row = 2                    # row 1 is a title ("MERCURY COLLECTIONS")
first_data_row = 3

[collections_layout.headers]
# Header text in the file = our field name. Case and extra spaces do not matter. For other
# spellings (e.g. Turkish headers), add more lines pointing to the same field names.
"Company Code" = "company_code"
"Customer" = "customer"
"Customer Name" = "customer_name"
"Document Date" = "document_date"
"Bank" = "bank"
"SAP Document No" = "sap_document_no"
"Government Inv" = "invoice_no"
"Amount in Original Currency" = "amount_original"
"Document currency" = "currency_original"
"Amount in local currency" = "amount_try"
"Local Currency" = "currency_local"

[ledger_layout]
# How the AR ledger (SAP's FBL5N report) is laid out.
header_row = 1
first_data_row = 2

[ledger_layout.headers]
"Company Code" = "company_code"
"Customer" = "customer"
"Customer Name" = "customer_name"
"Document Number" = "document_no"
"Document Type" = "document_type"
"Reference" = "reference"
"Invoice Reference" = "invoice_reference"
"Document Date" = "document_date"
"Posting Date" = "posting_date"
"Baseline Date" = "baseline_date"
"Terms of Payment" = "payment_terms"
"Net Due Date" = "net_due_date"
"Amount in Doc. Curr." = "amount_document"
"Document Currency" = "document_currency"
"Amount in Local Currency" = "amount_local"
"Clearing Date" = "clearing_date"
"Clearing Document" = "clearing_document"

[ledger_layout.document_types]
# The SAP document-type codes this ledger uses for each role.
invoice = ["RV"]
payment = ["DZ"]      # payments received, and refunds paid out
credit_memo = ["DG"]

[receivables]
# How each customer's receivables are summarised from the AR ledger.
min_cleared_for_delay = 3       # fewer cleared invoices: the usual delay is unknown (NaN)
horizons = 5                    # the "due in week t+1 ... t+5" columns
leak_check_weeks = [0, 16, 32, 48]  # rebuilt from a ledger cut off at the week and compared;
                                    # spread over the history (the last week proves little)

[debug]
one_day = 2025-06-02            # the day whose payment lines step 2 prints
sample_week = 30                # the week step 7 shows in detail (week 0 starts 2025-06-02)
