# Turkish public holidays, read by hurdle/holidays.py. A day without a daily file on a
# holiday is not a missing day. Named by `holidays_file` in the run settings.
#
# The fixed-date holidays are certain. The Bayram dates are listed by hand and are
# APPROXIMATE (to be confirmed by EY Finance). Every year needs BOTH Bayrams: a run whose
# data reaches a year without them stops with an error. Add 2027 before any data reaches
# late December 2026. Half-day holidays (the eve, "arife") are not listed.

[fixed]
# "MM-DD" = name; the same every year.
"01-01" = "New Year's Day"
"04-23" = "National Sovereignty and Children's Day"
"05-01" = "Labour and Solidarity Day"
"05-19" = "Commemoration of Atatürk, Youth and Sports Day"
"07-15" = "Democracy and National Unity Day"
"08-30" = "Victory Day"
"10-29" = "Republic Day"

[[bayram]]
name = "Ramazan Bayramı"
first_day = 2025-03-30
last_day = 2025-04-01

[[bayram]]
name = "Kurban Bayramı"
first_day = 2025-06-06
last_day = 2025-06-09

[[bayram]]
name = "Ramazan Bayramı"
first_day = 2026-03-20
last_day = 2026-03-22

[[bayram]]
name = "Kurban Bayramı"
first_day = 2026-05-27
last_day = 2026-05-30
